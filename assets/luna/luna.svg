<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 440">
  <!-- Luna menguante propia del portafolio (dibujada desde cero en SVG). Proporción 3:4, como la escena de la portada.
       Colores de la página: #FF2A45 y #B0142F. Para cambiar la luna, sustituye este archivo. -->
  <defs>
    <!-- Forma menguante: círculo de la luna menos un círculo desplazado arriba a la derecha -->
    <mask id="menguante">
      <circle cx="165" cy="170" r="118" fill="#fff"/>
      <circle cx="205" cy="146" r="104" fill="#000"/>
    </mask>
    <linearGradient id="cuerpo" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FF2A45"/>
      <stop offset=".45" stop-color="#C8183A"/>
      <stop offset="1" stop-color="#6E0B1E"/>
    </linearGradient>
    <radialGradient id="luz" cx="28%" cy="44%" r="55%">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hilo" gradientUnits="userSpaceOnUse" x1="0" y1="288" x2="0" y2="432">
      <stop offset="0" stop-color="#B0142F"/>
      <stop offset="1" stop-color="#B0142F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Órbitas finas que acompañan el borde iluminado -->
  <path d="M153.8 42.5 A128 128 0 1 0 263 252.3" fill="none" stroke="#B0142F" stroke-width="1.2" stroke-opacity=".55" stroke-linecap="round"/>
  <path d="M35.3 122.8 A138 138 0 0 0 96 289.5" fill="none" stroke="#B0142F" stroke-width=".8" stroke-opacity=".35" stroke-linecap="round"/>

  <!-- Cuerpo de la luna -->
  <g mask="url(#menguante)">
    <circle cx="165" cy="170" r="118" fill="url(#cuerpo)"/>
    <circle cx="165" cy="170" r="118" fill="url(#luz)"/>
    <!-- vetas finas concéntricas que dan textura sin imitar una luna real -->
    <g fill="none" stroke="#fff" stroke-linecap="round">
      <path d="M120 66 A110 110 0 0 0 92 262" stroke-opacity=".14" stroke-width=".9"/>
      <path d="M104 92 A100 100 0 0 0 100 252" stroke-opacity=".10" stroke-width=".7"/>
      <path d="M72 140 A94 94 0 0 0 128 262" stroke-opacity=".08" stroke-width=".7"/>
    </g>
  </g>

  <!-- Cuna bajo la luna -->
  <path d="M70 238 C92 330 238 330 260 238" fill="none" stroke="#B0142F" stroke-width=".9" stroke-opacity=".45"/>

  <!-- Colgante: hilo que cae de la luna, gota en contorno y rombo -->
  <path d="M165 288 V432" stroke="url(#hilo)" stroke-width="1.3"/>
  <circle cx="165" cy="300" r="3.6" fill="none" stroke="#B0142F" stroke-width="1"/>
  <path d="M165 306 C151 326 148 352 165 372 C182 352 179 326 165 306 Z" fill="none" stroke="#B0142F" stroke-width=".9" stroke-opacity=".7"/>
  <path d="M165 382 L172.5 394 L165 406 L157.5 394 Z" fill="#B0142F"/>

  <!-- Destellos de cuatro puntas -->
  <g fill="#FF2A45">
    <path d="M96 40 Q96 48 104 48 Q96 48 96 56 Q96 48 88 48 Q96 48 96 40 Z"/>
    <path d="M292 199 Q292 205 298 205 Q292 205 292 211 Q292 205 286 205 Q292 205 292 199 Z" fill-opacity=".8"/>
    <path d="M48 250 Q48 254 52 254 Q48 254 48 258 Q48 254 44 254 Q48 254 48 250 Z" fill-opacity=".6"/>
  </g>
</svg>
